<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オレカ風 モンスターバトル</title>
<style>
    :root {
        --primary: #ffd700;
        --bg: #111;
        --panel: #222;
        --text: #eee;
    }
    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        user-select: none;
    }
    #game-container {
        width: 100%;
        max-width: 600px;
        height: 100vh;
        max-height: 800px;
        background: #000;
        border: 2px solid #444;
        position: relative;
        display: flex;
        flex-direction: column;
    }
    .screen {
        display: none;
        flex-direction: column;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    }
    .screen.active {
        display: flex;
    }
    /* タイトルやリザルト画面の中央寄せ用 */
    .center-screen {
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    
    h1, h2 { text-align: center; color: var(--primary); margin-top: 0; }
    button {
        background: #333; color: white; border: 2px solid #555; padding: 12px 24px;
        font-size: 18px; cursor: pointer; border-radius: 5px; margin: 10px;
        transition: 0.2s;
        z-index: 100;
        position: relative;
    }
    button:hover { background: #555; border-color: var(--primary); }
    button:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; background: #333; }

    /* Deck Build Screen */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding-bottom: 80px; }
    .card {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        padding: 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .card:hover { border-color: var(--primary); }
    .card.selected { border-color: #0f0; background: #040; }
    .emoji { font-size: 30px; margin: 5px 0; }
    .stats { font-size: 11px; color: #aaa; text-align: left; width: 100%; margin-top: 5px; }
    .footer-bar {
        position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9);
        padding: 15px; border-top: 2px solid #444; text-align: center; z-index: 10;
        display: flex; justify-content: center; align-items: center;
    }

    /* Enemy Select Screen */
    .enemy-group {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        padding: 15px; margin-bottom: 10px; cursor: pointer; display: flex;
        justify-content: space-around;
    }
    .enemy-group:hover { border-color: #f00; background: #400; }

    /* Battle Screen */
    .battle-area { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .team { display: flex; justify-content: space-around; align-items: flex-end; height: 120px; }
    .team.enemies { align-items: flex-start; }
    .battler {
        background: var(--panel); border: 2px solid #555; border-radius: 8px;
        padding: 5px; text-align: center; width: 30%; position: relative;
        transition: transform 0.2s;
    }
    .battler.active-turn { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 0 10px var(--primary); }
    .battler.dead { opacity: 0.3; filter: grayscale(100%); }
    .hp-bar-bg { background: #555; height: 8px; border-radius: 4px; margin-top: 5px; overflow: hidden; width: 100%; }
    .hp-bar-fill { background: #0f0; height: 100%; transition: width 0.3s; }
    
    #message-box {
        background: rgba(0,0,0,0.85); border: 2px solid var(--primary); border-radius: 8px;
        padding: 10px; height: 180px; font-size: 16px; text-align: center;
        display: flex; flex-direction: column; justify-content: flex-start;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90%; z-index: 20; display: none;
    }
    
    /* Roulette UI */
    #roulette-container {
        display: flex; flex-direction: column; align-items: flex-start;
        background: #000; padding: 10px; border: 1px solid #555; border-radius: 5px;
        margin-top: 10px; width: 80%; margin-left: auto; margin-right: auto;
    }
    .r-row {
        display: flex; align-items: center; width: 100%; font-size: 16px; margin: 2px 0; color: #ccc;
    }
    .r-row.active { color: var(--primary); font-weight: bold; background: rgba(255, 215, 0, 0.2); }
    .r-cursor { width: 20px; color: var(--primary); visibility: hidden; font-weight: bold; }
    .r-row.active .r-cursor { visibility: visible; }
    .cmd-name { flex: 1; text-align: left; padding-left: 10px; }
</style>
</head>
<body>

<div id="game-container">
    <!-- Title Screen -->
    <div id="screen-title" class="screen active center-screen">
        <h1>オレカ風バトル</h1>
        <p style="color:#aaa;">※音声が出ます</p>
        <button onclick="initGame()">ゲームスタート</button>
    </div>

    <!-- Deck Build Screen -->
    <div id="screen-deck" class="screen">
        <h2>デッキ構築 (3体選ぶ)</h2>
        <div class="grid" id="deck-grid"></div>
        <div class="footer-bar">
            <span id="deck-count" style="margin-right:20px; font-weight:bold;">選択中: 0 / 3</span>
            <button id="btn-next-enemy" onclick="showEnemySelect()" disabled>バトルへ進む</button>
        </div>
    </div>

    <!-- Enemy Select Screen -->
    <div id="screen-enemy" class="screen">
        <h2>敵パーティを選択</h2>
        <div id="enemy-list" style="overflow-y: auto; flex: 1;"></div>
    </div>

    <!-- Battle Screen -->
    <div id="screen-battle" class="screen" style="overflow: hidden;">
        <div class="battle-area">
            <div class="team enemies" id="battle-enemies"></div>
            
            <div id="message-box">
                <div id="battle-msg" style="min-height: 24px; font-weight: bold;">バトル開始！</div>
                <div id="roulette-container" style="display: none;">
                    <div class="r-row" id="r-row-0"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-0"></span></div>
                    <div class="r-row" id="r-row-1"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-1"></span></div>
                    <div class="r-row" id="r-row-2"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-2"></span></div>
                    <div class="r-row" id="r-row-3"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-3"></span></div>
                    <div class="r-row" id="r-row-4"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-4"></span></div>
                    <div class="r-row" id="r-row-5"><span class="r-cursor">▶</span><span class="cmd-name" id="r-cmd-5"></span></div>
                </div>
            </div>
            
            <div class="team players" id="battle-players"></div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="screen-result" class="screen center-screen">
        <h1 id="result-title"></h1>
        <button onclick="resetGame()">タイトルへ戻る</button>
    </div>
</div>

<script>
    // --- Audio System ---
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'select') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'tick') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now);
            osc.start(now); osc.stop(now + 0.03);
        } else if (type === 'attack') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'critical') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'miss') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'upgrade') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(800, now+0.1);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    // --- Data (30 Monsters) ---

        {id:13,n:"フェアリー", e:"🧚", h:55, a:20, s:70, c:[{n:"光の粉",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"妖精のいたずら",t:"special"},{n:"ミス",t:"miss"},{n:"ホーリー",t:"critical"}]},
        {id:14,n:"ドラゴン", e:"🐉", h:180, a:45, s:45, c:[{n:"ミス",t:"miss"},{n:"ひっかき",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"火炎の息",t:"special"},{n:"尻尾ビンタ",t:"special"},{n:"ドラゴンバースト",t:"critical"}]},
        {id:15,n:"サムライ", e:"🏯", h:90, a:38, s:55, c:[{n:"刀撃",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"居合斬り",t:"special"},{n:"ミス",t:"miss"},{n:"燕返し",t:"critical"}]},
        {id:16,n:"ニンジャ", e:"🥷", h:70, a:32, s:85, c:[{n:"手裏剣",t:"normal"},{n:"クナイ",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"分身攻撃",t:"special"},{n:"暗殺術",t:"critical"}]},
        {id:17,n:"ゾンビ", e:"🧟", h:140, a:20, s:15, c:[{n:"ミス",t:"miss"},{n:"攻撃",t:"normal"},{n:"ミス",t:"miss"},{n:"毒ひっかき",t:"special"},{n:"かみつき",t:"special"},{n:"ミス",t:"miss"}]},
        {id:18,n:"ヴァンパイア", e:"🧛", h:120, a:35, s:50, c:[{n:"攻撃",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"ミス",t:"miss"},{n:"ブラッドドレイン",t:"special"},{n:"コウモリ化",t:"special"},{n:"真祖の力",t:"critical"}]},
        {id:19,n:"マーメイド", e:"🧜‍♀️", h:85, a:25, s:55, c:[{n:"水鉄砲",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"アクアストリーム",t:"special"},{n:"ミス",t:"miss"},{n:"大津波",t:"critical"}]},
        {id:20,n:"ミノタウロス", e:"🐃", h:150, a:42, s:25, c:[{n:"ミス",t:"miss"},{n:"斧振り",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"突進",t:"special"},{n:"ミス",t:"miss"},{n:"地裂斬",t:"critical"}]},
        {id:21,n:"フェニックス", e:"🦅", h:110, a:35, s:75, c:[{n:"つつく",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"炎の翼",t:"special"},{n:"ミス",t:"miss"},{n:"プロミネンス",t:"critical"}]},
        {id:22,n:"グリフォン", e:"🦅", h:125, a:38, s:65, c:[{n:"攻撃",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"トルネード",t:"special"},{n:"切り裂き",t:"special"},{n:"天の裁き",t:"critical"}]},
        {id:23,n:"スノウマン", e:"⛄", h:100, a:22, s:20, c:[{n:"雪玉",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"吹雪",t:"special"},{n:"ミス",t:"miss"},{n:"アイスバッシュ",t:"critical"}]},
        {id:24,n:"イフリート", e:"🔥", h:130, a:45, s:40, c:[{n:"ミス",t:"miss"},{n:"火炎弾",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"爆発",t:"special"},{n:"ミス",t:"miss"},{n:"ヘルファイア",t:"critical"}]},
        {id:25,n:"シルフ", e:"💨", h:65, a:25, s:90, c:[{n:"風の刃",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"エアカッター",t:"special"},{n:"ミス",t:"miss"},{n:"ハリケーン",t:"critical"}]},

        {id:27,n:"キメラ", e:"🦁", h:145, a:40, s:55, c:[{n:"ミス",t:"miss"},{n:"かみつき",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"毒の尾",t:"special"},{n:"炎の息",t:"special"},{n:"トリプルアタック",t:"critical"}]},
        {id:28,n:"バハムート", e:"🐲", h:200, a:50, s:60, c:[{n:"ミス",t:"miss"},{n:"竜の爪",t:"normal"},{n:"★→★★",t:"upgrade"},{n:"テラフレア",t:"special"},{n:"ミス",t:"miss"},{n:"ギガフレア",t:"critical"}]},
        {id:29,n:"ダークナイト", e:"🗡️", h:120, a:42, s:45, c:[{n:"暗黒剣",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"ブラッドサージ",t:"special"},{n:"ミス",t:"miss"},{n:"カオススラッシュ",t:"critical"}]},
        {id:30,n:"エンジェル", e:"👼", h:95, a:30, s:60, c:[{n:"聖なる光",t:"normal"},{n:"ミス",t:"miss"},{n:"★→★★",t:"upgrade"},{n:"ジャッジメント",t:"special"},{n:"ミス",t:"miss"},{n:"ヘブンズゲート",t:"critical"}]}
    ];

    let playerDeck = [];
    let enemyDeck = [];
    let allFighters = [];

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function initGame() {
        initAudio(); 
        playSound('select');
        playerDeck = [];
        renderDeckBuilder();
        switchScreen('screen-deck');
    }

    function renderDeckBuilder() {
        const grid = document.getElementById('deck-grid');
        grid.innerHTML = '';
        DB_MONSTERS.forEach(m => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<div class="emoji">${m.e}</div><b style="font-size:12px;">${m.n}</b>
                <div class="stats">HP:${m.h}<br>ATK:${m.a}<br>SPD:${m.s}</div>`;
            el.onclick = () => {
                if (playerDeck.includes(m)) {
                    playerDeck = playerDeck.filter(c => c !== m);
                    el.classList.remove('selected');
                } else if (playerDeck.length < 3) {
                    playerDeck.push(m);
                    el.classList.add('selected');
                    playSound('select');
                }
                document.getElementById('deck-count').innerText = `選択中: ${playerDeck.length} / 3`;
                document.getElementById('btn-next-enemy').disabled = playerDeck.length !== 3;
            };
            grid.appendChild(el);
        });
    }

    function showEnemySelect() {
        playSound('select');
        const list = document.getElementById('enemy-list');
        list.innerHTML = '';
        const groupCount = 4;
        for (let i = 0; i < groupCount; i++) {
            const enemyCount = Math.floor(Math.random() * 2) + 2; // 2〜3体
            let team = []; let html = '';
            for (let j = 0; j < enemyCount; j++) {
                const r = DB_MONSTERS[Math.floor(Math.random() * DB_MONSTERS.length)];
                team.push(JSON.parse(JSON.stringify(r)));
                html += `<div style="text-align:center"><div style="font-size:24px;">${r.e}</div><small>${r.n}</small></div>`;
            }
            const groupEl = document.createElement('div');
            groupEl.className = 'enemy-group'; groupEl.innerHTML = html;
            groupEl.onclick = () => startBattle(team);
            list.appendChild(groupEl);
        }
        switchScreen('screen-enemy');
    }

    function startBattle(enemies) {
        playSound('select');
        enemyDeck = enemies;
        allFighters = [];
        playerDeck.forEach((m, i) => allFighters.push({ ...m, isP: true, hpMax: m.h, hp: m.h, buff: 1, idx: i }));
        enemyDeck.forEach((m, i) => allFighters.push({ ...m, isP: false, hpMax: m.h, hp: m.h, buff: 1, idx: i }));
        
        renderBattle();
        switchScreen('screen-battle');
        showMsgBox("バトル開始！");
        setTimeout(battleLoop, 1500);
    }

    function renderBattle() {
        const pContainer = document.getElementById('battle-players');
        const eContainer = document.getElementById('battle-enemies');
        pContainer.innerHTML = ''; eContainer.innerHTML = '';

        allFighters.forEach(f => {
            const hpPct = Math.max(0, (f.hp / f.hpMax) * 100);
            const html = `
                <div class="battler ${f.hp <= 0 ? 'dead' : ''}" id="f-${f.isP?'p':'e'}-${f.idx}">
                    <div style="font-size:30px;">${f.e}</div>
                    <div style="font-size:11px; font-weight:bold; white-space:nowrap; overflow:hidden;">${f.n}</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${hpPct}%; background:${hpPct<30?'red':'#0f0'};"></div></div>
                </div>
            `;
            if (f.isP) pContainer.innerHTML += html;
            else eContainer.innerHTML += html;
        });
    }

    function showMsgBox(text) {
        const box = document.getElementById('message-box');
        box.style.display = 'flex';
        document.getElementById('battle-msg').innerText = text;
        document.getElementById('roulette-container').style.display = 'none';
    }

    function hideMsgBox() { document.getElementById('message-box').style.display = 'none'; }

    async function battleLoop() {
        hideMsgBox();
        const alive = allFighters.filter(f => f.hp > 0);
        if (alive.filter(f => f.isP).length === 0) { showResult(false); return; }
        if (alive.filter(f => !f.isP).length === 0) { showResult(true); return; }

        alive.sort((a, b) => b.s - a.s || Math.random() - 0.5);
        let queue = [...alive];
        
        const nextTurn = async () => {
            if (queue.length === 0) { setTimeout(battleLoop, 500); return; }
            
            const cur = queue.shift();
            if (cur.hp <= 0) { nextTurn(); return; }

            if (allFighters.filter(f => f.isP && f.hp > 0).length === 0) { showResult(false); return; }
            if (allFighters.filter(f => !f.isP && f.hp > 0).length === 0) { showResult(true); return; }

            document.querySelectorAll('.battler').forEach(el => el.classList.remove('active-turn'));
            document.getElementById(`f-${cur.isP?'p':'e'}-${cur.idx}`).classList.add('active-turn');
            
            showMsgBox(`${cur.n}のターン！`);
            await new Promise(r => setTimeout(r, 800));

            const cmd = await playRouletteUI(cur.c);
            
            let targets = allFighters.filter(f => f.isP !== cur.isP && f.hp > 0);
            let target = targets[Math.floor(Math.random() * targets.length)];

            if (cmd.t === 'upgrade') {
                cur.buff = 1.5; // 次のターン攻撃力1.5倍
                playSound('upgrade');
                showMsgBox(`${cur.n} の ★→★★！\n気合が高まった！（次回ダメージUP）`);
            } else if (cmd.t === 'miss') {
                playSound('miss');
                showMsgBox(`${cur.n} は ${cmd.n}！\nしかし なにもおきなかった！`);
            } else {
                let base = cur.a * cur.buff;
                cur.buff = 1; // バフ消費
                let mult = 0;
                let isCrit = false;
                if (cmd.t === 'normal') { mult = 0.8 + Math.random() * 0.4; } // -20% ~ +20%
                else if (cmd.t === 'special') { mult = 1.3 + Math.random() * 0.4; } // +30% ~ +70%
                else if (cmd.t === 'critical') { mult = 1.75 + Math.random() * 0.5; isCrit = true; } // +75% ~ +125%
                
                let dmg = Math.floor(base * mult);
                target.hp -= dmg;
                
                if(isCrit) playSound('critical'); else playSound('attack');
                showMsgBox(`${cur.n} の ${cmd.n}！\n${target.n} に ${dmg} のダメージ！`);
            }
            renderBattle();
            setTimeout(nextTurn, 1800);
        };
        nextTurn();
    }

    function playRouletteUI(cmds) {
        return new Promise(resolve => {
            const rCont = document.getElementById('roulette-container');
            document.getElementById('battle-msg').innerText = "コマンドを選択中...";
            rCont.style.display = 'flex';
            
            // Set commands to UI
            for(let i=0; i<6; i++) {
                document.getElementById(`r-cmd-${i}`).innerText = cmds[i].n;
                document.getElementById(`r-row-${i}`).className = 'r-row';
            }

            let currentIndex = 0;
            let ticks = 0;
            const maxTicks = 20 + Math.floor(Math.random() * 10);
            
            const interval = setInterval(() => {
                document.getElementById(`r-row-${currentIndex}`).classList.remove('active');
                currentIndex = (currentIndex + 1) % 6;
                document.getElementById(`r-row-${currentIndex}`).classList.add('active');
                playSound('tick');
                ticks++;
                
                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    setTimeout(() => {
                        rCont.style.display = 'none';
                        resolve(cmds[currentIndex]);
                    }, 800);
                }
            }, 80); // Speed of roulette
        });
    }

    function showResult(isWin) {
        hideMsgBox();
        document.getElementById('result-title').innerText = isWin ? "YOU WIN!!" : "GAME OVER...";
        document.getElementById('result-title').style.color = isWin ? "#0f0" : "#f00";
        switchScreen('screen-result');
    }

    function resetGame() { switchScreen('screen-title'); }
</script>
