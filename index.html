<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oki-Style Slot Simulator V14 - G-Reduction & Skip Lamp</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }
        #machine {
            background-color: #8b0000;
            border: 3px solid #ffd700;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        /* 上部ストック示唆ランプ */
        #top-lamp {
            width: 80%;
            height: 8px;
            background-color: #222;
            margin: 0 auto 15px auto;
            border-radius: 4px;
            transition: all 0.1s;
            border: 1px solid #111;
        }
        .flash-white { background-color: #fff; box-shadow: 0 0 3px #fff; }
        .flash-blue { background-color: #00aaff; box-shadow: 0 0 3px #00aaff; }
        .flash-green { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .flash-red { background-color: #ff0000; box-shadow: 0 0 12px #ff0000; }
        .flash-rainbow { 
            background: linear-gradient(90deg, red, orange, yellow, green, blue, purple); 
            box-shadow: 0 0 15px #fff; 
        }
        
        /* PT特化タイム中の黄色点滅 */
        @keyframes pulse-yellow {
            0% { background-color: #ccaa00; box-shadow: 0 0 5px #ccaa00; }
            50% { background-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            100% { background-color: #ccaa00; box-shadow: 0 0 5px #ccaa00; }
        }
        .pt-special-active { animation: pulse-yellow 0.8s infinite; }

        /* ビスカスランプ */
        #lamp-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        .lamp {
            width: 60px;
            height: 60px;
            background-color: #330000;
            border-radius: 50%;
            border: 2px solid #550000;
            transition: background-color 0.1s;
        }
        .lamp.flash {
            background-color: #ff3333;
            box-shadow: 0 0 25px #ff0000, 0 0 50px #ffaaaa;
            border-color: #ffaaaa;
        }
        /* 虹ランプ用 */
        @keyframes rotate-rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .lamp.flash-rainbow-lamp {
            background: linear-gradient(45deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            box-shadow: 0 0 30px #ffffff, 0 0 60px #ff00ff;
            border-color: #ffffff;
            animation: rotate-rainbow 0.5s linear infinite;
        }
        
        /* ミニランプ */
        #mini-lamps {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            padding: 5px;
            background-color: #000;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .mini-lamp {
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            border: 1px solid #000;
            box-shadow: inset 0 0 3px #000;
        }
        .mini-lamp.lit-red { background-color: #ff3333; box-shadow: 0 0 8px #ff3333, inset 0 0 3px #fff; border-color: #ffaaaa; }
        .mini-lamp.lit-white { background-color: #ffffff; box-shadow: 0 0 6px #ffffff, inset 0 0 2px #ccc; border-color: #ffffff; }
        .mini-lamp.lit-rainbow {
            background: linear-gradient(135deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            box-shadow: 0 0 10px #ffffff, inset 0 0 5px #fff;
            border-color: #fff;
            animation: rotate-rainbow 1s linear infinite;
        }

        /* パネル情報 */
        .info-panel {
            background-color: #000;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            border: 2px solid #333;
        }
        .highlight { color: #00ff00; font-weight: bold; }
        .danger { color: #ff3333; font-weight: bold; }
        .pt-highlight { color: #ffcc00; font-weight: bold; }
        .rainbow-text {
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        
        /* リール */
        #reels {
            display: flex;
            justify-content: space-between;
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .reel {
            width: 30%;
            height: 60px;
            background-color: #ddd;
            color: #000;
            font-size: 1.8rem;
            line-height: 60px;
            font-weight: bold;
            border: 2px solid #999;
            border-radius: 5px;
        }

        /* 操作系 */
        .controls-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 5px;
        }
        button {
            flex: 1;
            padding: 15px 5px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            touch-action: manipulation;
        }
        #spin-btn { background-color: #0066cc; color: #fff; }
        #spin-btn:disabled { background-color: #333; color: #666; }
        .skip-btn { background-color: #9900cc; color: #fff; }

        /* クレジットボックス */
        .credit-box {
            background-color: #000;
            border: 2px solid #444;
            border-radius: 5px;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 10px #000;
        }
        .credit-box span {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        .credit-box span.negative { color: #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        
        #console {
            background-color: #000;
            height: 140px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: #bbb;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* 裏履歴用UI */
        #ura-btn {
            font-size: 2.5rem;
            margin-top: 20px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        #ura-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background-color: rgba(10, 10, 10, 0.98);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            z-index: 1000;
            box-shadow: 0 0 30px #00ff00;
            box-sizing: border-box;
        }
        #ura-modal h3 {
            margin-top: 0;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }
        #ura-content {
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.5;
            color: #ddd;
        }
        #ura-content div { border-bottom: 1px dotted #444; padding: 4px 0; }
        .ura-big { color: #ff5555; font-weight: bold; }
        .ura-reg { color: #55aaff; font-weight: bold; }
        .ura-rainbow {
            background: linear-gradient(90deg, #ff5555, #ffff55, #55ff55, #5555ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        .close-btn {
            background-color: #444;
            color: #fff;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="machine">
        <div id="top-lamp"></div>

        <div id="lamp-container">
            <div class="lamp" id="lamp-left"></div>
            <div class="lamp" id="lamp-right"></div>
        </div>

        <div id="mini-lamps">
            <div class="mini-lamp" id="ml-1"></div><div class="mini-lamp" id="ml-2"></div>
            <div class="mini-lamp" id="ml-3"></div><div class="mini-lamp" id="ml-4"></div>
            <div class="mini-lamp" id="ml-5"></div><div class="mini-lamp" id="ml-6"></div>
            <div class="mini-lamp" id="ml-7"></div><div class="mini-lamp" id="ml-8"></div>
            <div class="mini-lamp" id="ml-9"></div><div class="mini-lamp" id="ml-10"></div>
        </div>

        <div class="info-panel">
            <div>PT: <span id="pt-display" class="pt-highlight">0</span> (<span id="game-count">0</span>G)</div>
            <div>状態: <span id="status-display">通常</span></div>
        </div>

        <div id="reels">
            <div class="reel" id="reel-0">🍒</div>
            <div class="reel" id="reel-1">🔔</div>
            <div class="reel" id="reel-2">🍉</div>
        </div>

        <div class="controls-row">
            <button id="spin-btn" onclick="manualSpin()">手動 1G回す</button>
        </div>
        
        <div class="credit-box">
            <span>差枚数</span> <span id="net-tokens">0</span>
        </div>

        <div class="controls-row">
            <button class="skip-btn" onclick="executeSkip()">イベントスキップ</button>
        </div>

        <div id="console"></div>
    </div>

    <!-- 裏履歴ボタン＆モーダル -->
    <div id="ura-btn" onclick="toggleUra()">📗</div>

    <div id="ura-modal">
        <h3>裏履歴 (ストック＆直撃ログ)</h3>
        <div id="ura-content">ここに履歴が表示されます</div>
        <button class="close-btn" onclick="toggleUra()">閉じる</button>
    </div>

    <script>
        /* ========================================================
           サウンド・BGM設定
        ======================================================== */
        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'stop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'kyuin') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(2000, now + 0.4);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'pay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1500, now);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function playBGM(type) {
            stopBGM();
            if (!audioCtx || audioCtx.state !== 'running') return;
            let notes = [];
            let speed = 150;
            let oscType = 'square';
            
            if (type === 'BIG') {
                notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]; 
                speed = 120;
            } else if (type === 'REG') {
                notes = [392.00, 440.00, 493.88, 392.00]; 
                speed = 250;
                oscType = 'triangle';
            } else if (type === 'RAINBOW_BIG') {
                notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50]; 
                speed = 100;
            }

            let step = 0;
            bgmInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = oscType;
                osc.frequency.value = notes[step % notes.length];
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (speed/1000) * 0.9);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + (speed/1000));
                step++;
            }, speed);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        /* ========================================================
           内部状態・パラメータ
        ======================================================== */
        let games = 0;
        let points = 0; 
        let netTokens = 0;
        let chainTokens = 0;
        let mode = 'normal';
        let stockQueue = [];
        let pendingBonus = null;
        let currentBonus = null;
        let atGamesLeft = 0;
        
        let hiddenMode = 'A';
        let currentCeiling = 1200; 
        let pullbackCeiling = 32; // ボーナス後の引き戻し天井（短縮あり）
        let bonusStockCount = 0;  // ボーナス中に獲得したストック数
        
        let isPtSpecial = false;
        let ptSpecialGamesLeft = 0;
        let isBellRush = false;
        let bellRushGamesLeft = 0;

        let bonusGainedTokens = 0;
        let miniLampColors = [];
        
        let hasTriggered10Lamps = false;
        let hasDoneRainbowBIG = false; 
        let premiumThreshold = 2250;   
        let isPremiumRoute = false;    

        let isSkipping = false;
        let isRevealing = false; 

        let displayedNetTokens = 0;
        let tokenAnimInterval = null;
        let uraLogs = [];

        const domGames = document.getElementById('game-count');
        const domPt = document.getElementById('pt-display');
        const domNet = document.getElementById('net-tokens');
        const domStatus = document.getElementById('status-display');
        const lamps = [document.getElementById('lamp-left'), document.getElementById('lamp-right')];
        const consoleEl = document.getElementById('console');
        const reels = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
        const topLamp = document.getElementById('top-lamp');
        const uraContent = document.getElementById('ura-content');
        const uraModal = document.getElementById('ura-modal');

        function getBonusTag(type) {
            if (type === 'RAINBOW_BIG') return '<span class="rainbow-text">虹BIG</span>';
            return type === 'BIG' ? '<span style="color:#ff5555; font-weight:bold;">BIG</span>' : '<span style="color:#55aaff; font-weight:bold;">REG</span>';
        }

        /* ========================================================
           裏履歴ロジック
        ======================================================== */
        function addUraLog(type, reason, isActionStr = false) {
            let typeStr = '';
            if (type === 'RAINBOW_BIG') typeStr = '<span class="ura-rainbow">虹BIG</span>';
            else if (type === 'BIG') typeStr = '<span class="ura-big">BIG</span>';
            else if (type === 'REG') typeStr = '<span class="ura-reg">REG</span>';
            
            const actionStr = isActionStr ? typeStr : (typeStr + 'ストック獲得');
            const logMsg = `<div>${points}PT/${games}G ${reason}から${actionStr}</div>`;
            uraLogs.unshift(logMsg);
            if (uraLogs.length > 50) uraLogs.pop();
            uraContent.innerHTML = uraLogs.join('');
        }
        function addUraLogMisc(reason) {
            uraLogs.unshift(`<div>${points}PT/${games}G ${reason}</div>`);
            if (uraLogs.length > 50) uraLogs.pop();
            uraContent.innerHTML = uraLogs.join('');
        }

        function toggleUra() {
            if (uraModal.style.display === 'block') {
                uraModal.style.display = 'none';
            } else {
                uraModal.style.display = 'block';
                if (uraLogs.length === 0) uraContent.innerHTML = '<div>まだ履歴はありません。</div>';
            }
        }

        /* ========================================================
           モード移行・初期化ロジック
        ======================================================== */
        function setHiddenMode(isResetEquivalent = false) {
            const r = Math.random();
            let nextMode = 'A';

            if (isResetEquivalent) {
                if (r < 0.40) nextMode = 'A';
                else if (r < 0.70) nextMode = 'B';
                else nextMode = 'Heaven';
            } else {
                if (hiddenMode === 'A') {
                    if (r < 0.50) nextMode = 'A';
                    else if (r < 0.97) nextMode = 'B';
                    else nextMode = 'Heaven';
                } else if (hiddenMode === 'B') {
                    if (r < 0.05) nextMode = 'A';
                    else if (r < 0.45) nextMode = 'B';
                    else nextMode = 'Heaven';
                } else if (hiddenMode === 'Heaven') {
                    if (r < 0.70) nextMode = 'A';
                    else if (r < 0.90) nextMode = 'B';
                    else nextMode = 'Heaven';
                }
            }
            hiddenMode = nextMode;
            currentCeiling = (hiddenMode === 'B') ? 800 : (hiddenMode === 'Heaven' ? 200 : 1200);
            if (hasDoneRainbowBIG && hiddenMode === 'A') {
                currentCeiling = 800; 
            }
        }

        function initMachine() {
            setHiddenMode(true);
            pullbackCeiling = 32;
            log("設定変更(リセット)完了。");
            checkStock(0.20, 0.20, "リセット恩恵");
        }

        function log(msg) {
            consoleEl.innerHTML = `<div>${msg}</div>` + consoleEl.innerHTML;
        }

        function setLamp(state, isRainbow = false) {
            lamps.forEach(l => {
                l.className = 'lamp'; 
                if (state) {
                    if (isRainbow) l.classList.add('flash-rainbow-lamp');
                    else l.classList.add('flash');
                }
            });
        }

        function flashTopLamp() {
            if (isPtSpecial) return;
            let colorClass = 'flash-white';
            let r = Math.random();
            let s = stockQueue.length;

            if (s >= 3) {
                if (r < 0.005) colorClass = 'flash-rainbow';
                else if (r < 0.030) colorClass = 'flash-red';
                else if (r < 0.100) colorClass = 'flash-green';
                else if (r < 0.350) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            } else if (s >= 1) {
                if (r < 0.015) colorClass = 'flash-red';
                else if (r < 0.080) colorClass = 'flash-green';
                else if (r < 0.300) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            } else {
                if (r < 0.050) colorClass = 'flash-green';
                else if (r < 0.250) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            }

            topLamp.className = colorClass;
            setTimeout(() => { 
                if(!isPtSpecial) topLamp.className = ''; 
                else topLamp.className = 'pt-special-active';
            }, 500);
        }

        function updateTokenDisplay(targetTokens) {
            if (displayedNetTokens === targetTokens) return;
            if (tokenAnimInterval) clearInterval(tokenAnimInterval);
            
            let diff = Math.abs(targetTokens - displayedNetTokens);
            let step = targetTokens > displayedNetTokens ? 1 : -1;
            let intervalMs = 25; 

            if (diff > 20) intervalMs = 10;
            if (diff > 100) step *= Math.floor(diff / 50);

            tokenAnimInterval = setInterval(() => {
                displayedNetTokens += step;
                if ((step > 0 && displayedNetTokens >= targetTokens) || 
                    (step < 0 && displayedNetTokens <= targetTokens)) {
                    displayedNetTokens = targetTokens;
                    clearInterval(tokenAnimInterval);
                }
                domNet.innerText = displayedNetTokens;
                if (displayedNetTokens >= 0) domNet.classList.remove('negative');
                else domNet.classList.add('negative');
            }, intervalMs);
        }

        /* ========================================================
           抽選ロジック
        ======================================================== */
        function checkStock(bigProb, regProb, reason) {
            let r = Math.random();
            if (r < bigProb) {
                stockQueue.push('BIG');
                addUraLog('BIG', reason, false);
                return true;
            } else if (r < (bigProb + regProb)) {
                stockQueue.push('REG');
                addUraLog('REG', reason, false);
                return true;
            }
            return false;
        }

        function trigger75Loop(reason) {
            let loopCount = 1;
            while (Math.random() < 0.75) {
                if (Math.random() < 0.5) { stockQueue.push('BIG'); addUraLog('BIG', `${reason}(${loopCount}連目)`, false); }
                else { stockQueue.push('REG'); addUraLog('REG', `${reason}(${loopCount}連目)`, false); }
                loopCount++;
            }
        }
        
        function trigger95RegLoop(reason) {
            let loopCount = 1;
            while (Math.random() < 0.95) {
                stockQueue.push('REG'); addUraLog('REG', `${reason}(${loopCount}連目)`, false);
                loopCount++;
            }
        }
        
        function trigger25Loop(reason) {
            let loopCount = 1;
            while (Math.random() < 0.25) {
                if (Math.random() < 0.5) { stockQueue.push('BIG'); addUraLog('BIG', `${reason}(${loopCount}連目)`, false); }
                else { stockQueue.push('REG'); addUraLog('REG', `${reason}(${loopCount}連目)`, false); }
                loopCount++;
            }
        }

        function determineRole() {
            const r = Math.random();
            if (mode === 'bonus') {
                if (r < 0.65) return { type: 'medium_bell', pay: 8, net: 5, name: '中ベル', symbol: '🔔' }; 
                if (r < 0.80) return { type: 'replay', pay: 3, net: 0, name: 'リプレイ', symbol: '🔄' };
                if (r < 0.82) return { type: 'suika', pay: 6, net: 3, name: 'スイカ', symbol: '🍉' };
                if (r < 0.83) return { type: 'cherry', pay: 2, net: -1, name: 'チェリー', symbol: '🍒' };
                return { type: 'blank', pay: 0, net: -3, name: 'ハズレ', symbol: '❌' };
            } else {
                if (stockQueue.length > 0 && Math.random() < (1/25.6)) {
                    return { type: 'fake_cherry', pay: 2, net: -1, name: 'チェリー', symbol: '🍒' }; 
                }
                
                let cumProb = 0;
                cumProb += (1/6.6); 
                if (r < cumProb) return { type: 'replay', pay: 3, net: 0, name: 'リプレイ', symbol: '🔄' };
                
                if (isBellRush) cumProb += (1/2.24);
                else cumProb += (1/22.4);
                
                if (r < cumProb) return { type: 'small_bell', pay: 6, net: 3, name: '小ベル', symbol: '🔔' };
                
                cumProb += (1/99.9); 
                if (r < cumProb) return { type: 'medium_bell', pay: 11, net: 8, name: '中ベル', symbol: '🔔' };
                
                cumProb += (1/51.2); 
                if (r < cumProb) return { type: 'suika', pay: 9, net: 6, name: 'スイカ', symbol: '🍉' };
                
                cumProb += (1/102.4); 
                if (r < cumProb) return { type: 'cherry', pay: 5, net: 2, name: 'チェリー', symbol: '🍒' };
                
                return { type: 'blank', pay: 0, net: -3, name: 'ハズレ', symbol: '❌' };
            }
        }

        function playOneGame(isMuted = false) {
            initAudio();

            if (pendingBonus && mode !== 'bonus') {
                executeBonusReveal(isMuted);
                return;
            }

            const role = determineRole(); 

            if (mode !== 'bonus') {
                if (isPtSpecial) {
                    ptSpecialGamesLeft--;
                    if (ptSpecialGamesLeft <= 0) {
                        if (Math.random() < 0.20) ptSpecialGamesLeft = 3; 
                        else isPtSpecial = false;
                    }
                } else {
                    if (role.type === 'suika' || role.type === 'cherry' || role.type === 'fake_cherry') {
                        if (Math.random() < 0.20) {
                            isPtSpecial = true;
                            ptSpecialGamesLeft = 3;
                        }
                    }
                }
                
                if (isBellRush) {
                    if (bellRushGamesLeft > 0) {
                        bellRushGamesLeft--;
                    } else {
                        if (Math.random() < 0.10) {
                            isBellRush = false;
                            addUraLogMisc('ベル連状態終了');
                        }
                    }
                } else {
                    if (role.type === 'small_bell' && Math.random() < 0.01) {
                        isBellRush = true; bellRushGamesLeft = 20; addUraLogMisc('ベル連状態突入(3枚ベル)');
                    } else if (role.type === 'medium_bell' && Math.random() < 0.06) {
                        isBellRush = true; bellRushGamesLeft = 20; addUraLogMisc('ベル連状態突入(8枚ベル)');
                    }
                }
            }

            if (mode !== 'bonus') {
                games++;
                
                // 引き戻しモード終了時（可変天井到達後）に通常転落
                if (mode === 'pullback' && games === pullbackCeiling + 1) {
                    log(`${pullbackCeiling}Gスルー 合計<span class="bonus-result">${chainTokens}枚獲得</span> 通常モードへ`);
                    mode = 'normal';
                    chainTokens = 0;
                    pullbackCeiling = 32; 
                    
                    let isResetEquivalent = hasTriggered10Lamps || hasDoneRainbowBIG;
                    setHiddenMode(isResetEquivalent);
                    
                    if (isResetEquivalent) {
                        checkStock(0.20, 0.20, "リセット相当の恩恵"); 
                    } else {
                        checkStock(0.10, 0.10, "通常転落恩恵"); 
                    }
                    
                    miniLampColors = [];
                    hasTriggered10Lamps = false;
                    updateUI(); 
                }

                let oldPoints = points;
                let ptGain = 1; 
                if (role.type === 'replay') ptGain = 3;
                else if (role.type === 'suika' || role.type === 'cherry' || role.type === 'fake_cherry') ptGain = 10;
                
                if (isPtSpecial) ptGain *= 2;
                points += ptGain;

                let oldHundreds = Math.floor(oldPoints / 100);
                let newHundreds = Math.floor(points / 100);
                if (newHundreds > oldHundreds) {
                    let crosses = newHundreds - oldHundreds;
                    for (let i = 0; i < crosses; i++) {
                        let currentHundred = (oldHundreds + i + 1) * 100;
                        checkStock(0.07, 0.08, `${currentHundred}PT到達`);
                        if (hiddenMode === 'Heaven' && currentHundred === 100) {
                            checkStock(0.25, 0.25, "天国100PT到達");
                        }
                    }
                }

                if (points >= currentCeiling && oldPoints < currentCeiling) {
                    if (hiddenMode === 'Heaven') {
                        if (Math.random() < 0.5) { stockQueue.push('BIG'); addUraLog('BIG', "天国天井(200PT)到達", false); }
                        else { stockQueue.push('REG'); addUraLog('REG', "天国天井(200PT)到達", false); }
                        trigger25Loop("天国天井25%ループ");
                    } else {
                        checkStock(0.40, 0.60, "通常天井到達");
                    }
                    pendingBonus = stockQueue.shift();
                }
            }

            netTokens += role.net;
            if (mode === 'bonus' || mode === 'pullback') chainTokens += role.net;
            if (mode === 'bonus') bonusGainedTokens += role.net;

            if (role.pay > 0 && currentRole !== 'replay' && !isMuted) playSound('pay');
            else if (!isMuted) playSound('spin');

            if (mode === 'bonus') {
                if (role.type === 'suika' || role.type === 'cherry') {
                    if (bonusStockCount < 1) {
                        let hit = false;
                        if (currentBonus === 'REG') {
                            if (role.type === 'suika') hit = checkStock(0.10, 0.025, "REG中のスイカ");
                            else if (role.type === 'cherry') hit = checkStock(0.075, 0.175, "REG中のチェリー");
                        } else {
                            if (role.type === 'suika') hit = checkStock(0.047, 0.003, "BIG中のスイカ");
                            else if (role.type === 'cherry') hit = checkStock(0.03, 0.07, "BIG中のチェリー");
                        }
                        if (hit) bonusStockCount++;
                    } else {
                        // ストック獲得済みのレア役は次回告知G数を短縮
                        pullbackCeiling = Math.max(2, pullbackCeiling - 5);
                        addUraLogMisc(`${role.name}成立: 次回告知最大 ${pullbackCeiling}Gに短縮`);
                    }
                } else if (role.type === 'blank') {
                    if (bonusStockCount < 1) {
                        let hit = false;
                        if (currentBonus === 'REG') hit = checkStock(0.0015, 0.0015, "REG中のハズレ");
                        else hit = checkStock(0.0005, 0.0005, "BIG中のハズレ");
                        if (hit) bonusStockCount++;
                    }
                }
            } else {
                if (role.type === 'blank') checkStock(0.0001, 0.0004, "通常ハズレ");
                if (role.type === 'suika' || role.type === 'cherry') {
                    checkStock(0.02, 0.03, `${role.name}成立`);
                }
            }

            if (mode !== 'bonus' && !pendingBonus && points < currentCeiling) {
                let isSelfDrawn = false; 
                if (role.type === 'suika') {
                    if (Math.random() < 0.027) { pendingBonus = 'BIG'; isSelfDrawn = true; addUraLog('BIG', "スイカ直撃", true); }
                    else if (Math.random() < 0.030) { pendingBonus = 'REG'; isSelfDrawn = true; addUraLog('REG', "スイカ直撃", true); }
                } else if (role.type === 'cherry') {
                    if (Math.random() < 0.015) { pendingBonus = 'BIG'; isSelfDrawn = true; addUraLog('BIG', "チェリー直撃", true); }
                    else if (Math.random() < 0.050) { pendingBonus = 'REG'; isSelfDrawn = true; addUraLog('REG', "チェリー直撃", true); }
                }
                
                if (!pendingBonus) {
                    if (Math.random() < (1/920)) { pendingBonus = 'BIG'; isSelfDrawn = true; addUraLog('BIG', "1/920直撃", true); } 
                    else if (Math.random() < (1/920)) { pendingBonus = 'REG'; isSelfDrawn = true; addUraLog('REG', "1/920直撃", true); } 
                }

                if (isSelfDrawn && mode === 'pullback' && stockQueue.length === 0 && hasTriggered10Lamps) {
                    trigger75Loop("自力引き戻し75%ループ");
                }
            }

            // ストック放出判定（短縮された天井を使用）
            if (mode === 'pullback' && !pendingBonus && stockQueue.length > 0) {
                if (stockQueue[0] === 'RAINBOW_BIG' || Math.random() < (1/16) || games >= pullbackCeiling) {
                    pendingBonus = stockQueue.shift();
                }
            }

            if (pendingBonus && pendingBonus !== 'RAINBOW_BIG' && !isPremiumRoute) {
                if (netTokens >= premiumThreshold) {
                    pendingBonus = 'BIG';
                    stockQueue = []; 
                    isPremiumRoute = true;
                    addUraLog('BIG', "差枚2250枚突破(プレミアムルート突入)", true);
                    log(`<span class="rainbow-text">【エンディング到達！】目標差枚クリア。次Gよりプレミアムルートへ！</span>`);
                }
            }

            if (mode === 'bonus') {
                atGamesLeft--;
                if (atGamesLeft <= 0) {
                    stopBGM(); 
                    log(`<span class="bonus-result">${getBonusTag(currentBonus)}終了 ${bonusGainedTokens}枚獲得 引き戻しモードへ</span>`);
                    mode = 'pullback';
                    currentBonus = null;
                    setLamp(false);
                    
                    if (isPremiumRoute) {
                        isPremiumRoute = false;
                        stockQueue.unshift('RAINBOW_BIG'); 
                    } else {
                        if (!isMuted) flashTopLamp();
                    }
                }
            } 

            if (!isMuted) {
                reels.forEach(r => r.innerText = role.symbol);
                updateUI();
            }
            
            currentRole = role.type; 
        }

        function executeBonusReveal(isMuted) {
            let hitGame = games; 
            let hitPt = points; 
            
            games++;
            netTokens -= 3;
            chainTokens -= 3;
            let pB = pendingBonus;
            pendingBonus = null;

            if (mode === 'normal') chainTokens = -3;

            if (!isMuted) {
                isRevealing = true;
                document.getElementById('spin-btn').disabled = true;
                playSound('spin');
                
                updateUI();
                
                if (pB === 'RAINBOW_BIG') setLamp(true, true);
                else setLamp(true, false);

                let r0 = setInterval(()=>reels[0].innerText = '🔄', 50);
                let r1 = setInterval(()=>reels[1].innerText = '🔄', 50);
                let r2 = setInterval(()=>reels[2].innerText = '🔄', 50);

                setTimeout(() => { clearInterval(r0); reels[0].innerText = '7️⃣'; playSound('stop'); }, 400);
                setTimeout(() => { clearInterval(r1); reels[1].innerText = '7️⃣'; playSound('stop'); }, 800);
                setTimeout(() => { 
                    clearInterval(r2); 
                    reels[2].innerText = (pB === 'BIG' || pB === 'RAINBOW_BIG') ? '7️⃣' : 'BAR'; 
                    playSound('stop');
                    
                    setTimeout(()=> {
                        isRevealing = false;
                        triggerBonusFinalize(pB, isMuted, hitGame, hitPt);
                        document.getElementById('spin-btn').disabled = false;
                    }, 600);
                }, 1200);
            } else {
                triggerBonusFinalize(pB, isMuted, hitGame, hitPt);
            }
        }

        function triggerBonusFinalize(type, isMuted, hitGame, hitPt) {
            mode = 'bonus';
            currentBonus = type;
            atGamesLeft = 20; 
            if (type === 'BIG') atGamesLeft = 60;
            else if (type === 'RAINBOW_BIG') atGamesLeft = 300;
            
            games = 0; 
            points = 0;
            isPtSpecial = false;
            ptSpecialGamesLeft = 0;
            isBellRush = false; 
            bonusGainedTokens = 0; 
            
            // ボーナス開始時の初期化
            bonusStockCount = 0;
            pullbackCeiling = 32;
            
            if (type === 'RAINBOW_BIG') {
                premiumThreshold = netTokens + 2250;
                hasDoneRainbowBIG = true;
                hasTriggered10Lamps = false;
                miniLampColors = ['rainbow', 'rainbow', 'rainbow', 'rainbow', 'rainbow'];
                stockQueue = [];
                addUraLog('RAINBOW_BIG', "エンディング/虹BIG開始", true);
            } else {
                if (type === 'BIG') {
                    if (miniLampColors.length < 10) miniLampColors.push('red');
                    if (miniLampColors.length < 10) miniLampColors.push('red');
                } else if (type === 'REG') {
                    if (miniLampColors.length === 9 && miniLampColors.every(c => c === 'white')) {
                        miniLampColors.push('white');
                    } else if (miniLampColors.length < 9) {
                        miniLampColors.push('white');
                    }
                }

                if (miniLampColors.length === 10 && !hasTriggered10Lamps) {
                    hasTriggered10Lamps = true;
                    
                    if (miniLampColors.every(c => c === 'white')) {
                        trigger95RegLoop("裏REG突入");
                    } else {
                        if (Math.random() < 0.05) {
                            stockQueue = [];
                            stockQueue.unshift('RAINBOW_BIG');
                            addUraLog('RAINBOW_BIG', "ミニランプ10個到達(5%振り分け)", false);
                        } else {
                            stockQueue.unshift('BIG');
                            addUraLog('BIG', "ミニランプ10個到達(1G連保証)", false);
                            trigger75Loop("ミニランプ10個到達(75%ループ)");
                        }
                    }
                }
            }

            // REG恩恵の調整
            if (type === 'REG') checkStock(0.0625, 0.0625, "REG成立恩恵");

            if (!isMuted) {
                playSound('kyuin');
                playBGM(type); 
                log(`<span class="danger">キュイン！ ${getBonusTag(type)} BONUS 確定！ (${hitPt}PT / ${hitGame}G)</span>`);
                updateUI();
            } else {
                log(`<span class="danger">キュイン！ ${getBonusTag(type)} BONUS 確定！ (${hitPt}PT / ${hitGame}G)</span>`);
            }
        }

        /* ========================================================
           UI・操作系
        ======================================================== */
        function updateUI() {
            domGames.innerText = games;
            domPt.innerText = points;
            
            updateTokenDisplay(netTokens);
            
            let statusText = '通常';
            if (mode === 'bonus') {
                let dispBonus = '';
                if (currentBonus === 'RAINBOW_BIG') dispBonus = '<span class="rainbow-text">虹BIG</span>';
                else dispBonus = currentBonus === 'BIG' ? '<span style="color:#ff3333;">BIG</span>' : '<span style="color:#3399ff;">REG</span>';
                statusText = `${dispBonus} (${atGamesLeft}G)`;
            } else if (mode === 'pullback') {
                statusText = `引き戻し`;
            }
            
            if (isBellRush && mode !== 'bonus') {
                statusText += ' <span style="color:#ffff00; font-size:0.9rem;">(ベル連)</span>';
            }
            
            domStatus.innerHTML = statusText;

            for (let i = 1; i <= 10; i++) {
                const ml = document.getElementById(`ml-${i}`);
                ml.className = 'mini-lamp'; 
                if (i <= miniLampColors.length) {
                    if (miniLampColors[i-1] === 'red') ml.classList.add('lit-red');
                    else if (miniLampColors[i-1] === 'white') ml.classList.add('lit-white');
                    else if (miniLampColors[i-1] === 'rainbow') ml.classList.add('lit-rainbow');
                }
            }

            if (pendingBonus !== null && pendingBonus !== 'RAINBOW_BIG') {
                setLamp(true, false);
            }

            if (isPtSpecial) topLamp.className = 'pt-special-active';
            else if (topLamp.className === 'pt-special-active') topLamp.className = ''; 
        }

        function manualSpin() {
            if (isSkipping || isRevealing) return;
            playOneGame(false);
        }

        function executeSkip() {
            if (isSkipping || isRevealing) return;
            isSkipping = true;
            
            let loopCount = 0;
            let startMode = mode;

            while (loopCount < 2500) {
                loopCount++;
                playOneGame(true); 

                if (startMode === 'normal') {
                    if (pendingBonus !== null || mode === 'bonus') break;
                } else if (startMode === 'bonus') {
                    if (mode !== 'bonus') break;
                } else if (startMode === 'pullback') {
                    if (pendingBonus !== null || mode === 'bonus' || mode === 'normal') break;
                }
            }

            isSkipping = false;
            updateUI();
            
            // スキップでボーナスを終了して引き戻しに入った直後の場合、トップランプを示唆
            if (startMode === 'bonus' && mode === 'pullback' && games === 0) {
                flashTopLamp();
            }
        }

        initMachine();

    </script>
</body>
</html>
