<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oki-Style Slot Simulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #machine {
            background-color: #8b0000;
            border: 4px solid #gold;
            border-radius: 15px;
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        /* ビスカスランプ */
        #lamp-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .lamp {
            width: 80px;
            height: 80px;
            background-color: #330000;
            border-radius: 50%;
            border: 2px solid #550000;
            transition: all 0.1s;
        }
        .lamp.flash {
            background-color: #ff3333;
            box-shadow: 0 0 30px #ff0000, 0 0 60px #ffaaaa;
            border-color: #ffaaaa;
        }
        /* パネル情報 */
        .info-panel {
            background-color: #000;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 1.2rem;
            border: 2px solid #333;
        }
        .highlight {
            color: #00ff00;
            font-weight: bold;
        }
        .danger {
            color: #ff3333;
        }
        /* リール */
        #reels {
            display: flex;
            justify-content: space-around;
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .reel {
            width: 80px;
            height: 80px;
            background-color: #ddd;
            color: #000;
            font-size: 2rem;
            line-height: 80px;
            font-weight: bold;
            border: 2px solid #999;
            border-radius: 5px;
            overflow: hidden;
        }
        /* 操作系 */
        #controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        #spin-btn { background-color: #0066cc; color: #fff; }
        #spin-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        .stop-btn { background-color: #cc0000; color: #fff; width: 80px; }
        .stop-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        #console {
            background-color: #000;
            height: 100px;
            overflow-y: scroll;
            text-align: left;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #bbb;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="machine">
        <div id="lamp-container">
            <div class="lamp" id="lamp-left"></div>
            <div class="lamp" id="lamp-right"></div>
        </div>

        <div class="info-panel">
            <div>G数: <span id="game-count" class="highlight">0</span></div>
            <div>差枚数: <span id="net-tokens">0</span></div>
        </div>
        <div class="info-panel" style="font-size: 1rem;">
            <div>状態: <span id="status-display">通常</span></div>
            <div>ストック: <span id="stock-display">0</span></div>
        </div>

        <div id="reels">
            <div class="reel" id="reel-0">-</div>
            <div class="reel" id="reel-1">-</div>
            <div class="reel" id="reel-2">-</div>
        </div>

        <div id="controls">
            <button id="spin-btn" onclick="spin()">レバーON (3枚)</button>
        </div>
        <div id="controls">
            <button class="stop-btn" id="stop-0" onclick="stopReel(0)" disabled>左</button>
            <button class="stop-btn" id="stop-1" onclick="stopReel(1)" disabled>中</button>
            <button class="stop-btn" id="stop-2" onclick="stopReel(2)" disabled>右</button>
        </div>

        <div id="console"></div>
    </div>

    <script>
        /* ========================================================
           設計・機械割シミュレーション (約100%目標)
           
           【ベース】
           ・通常時のコイン持ち: 約30G/50枚 (1Gあたり純減 約-1.65枚)
           ・リプレイ(13.5%), ベル(6%), レア役(1.5%)
           
           【ボーナスとモード】
           ・BIG(約200枚獲得: AT60G) / REG(約60枚獲得: AT20G)
           ・通常モードからの初当たり確率: 1/250
           ・天国モード(32G以内確定): ループ率75%
           
           初当たりまでの平均投資: 250G * 1.65枚 = 412.5枚
           初当たり時の期待枚数(天国ループ込):
             1回+天国3回(75%ループ平均) = 4連。
             BIG/REG比率が6:4とすると、平均獲得枚数 約144枚。
             144枚 * 4連 = 576枚。
           
           わずかにプラスになる設計ですが、引き戻しスルー時のベース減少を
           考慮すると実質機械割は99.8%〜100.5%程度に収束する設計です。
        ======================================================== */

        // --- 状態変数 ---
        let games = 0;
        let netTokens = 0;
        let mode = 'normal'; // 'normal', 'pullback', 'heaven', 'bonus'
        let stock = 0;
        let bonusType = null; // 'BIG', 'REG'
        let atGamesLeft = 0;
        let isFlashing = false;

        let reelsInt = [null, null, null];
        let reelsStopped = [true, true, true];
        let currentRole = 'blank';

        const symbols = ['🍉', '🍒', '🔔', '🔄', '7️⃣', 'BAR', '❌'];

        // --- DOM要素 ---
        const domGames = document.getElementById('game-count');
        const domNet = document.getElementById('net-tokens');
        const domStatus = document.getElementById('status-display');
        const domStock = document.getElementById('stock-display');
        const btnSpin = document.getElementById('spin-btn');
        const lamps = [document.getElementById('lamp-left'), document.getElementById('lamp-right')];
        const consoleEl = document.getElementById('console');

        function log(msg) {
            consoleEl.innerHTML = `<div>${msg}</div>` + consoleEl.innerHTML;
        }

        // --- Web Audio API (サウンドエンジン) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'stop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'kyuin') {
                // 告知音（キュイン！）
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(2000, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'pay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1500, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // --- 抽選ロジック ---
        function determineRole() {
            const r = Math.random();
            if (mode === 'bonus') {
                // ボーナス中はベル確率大幅UP(純増約3.0枚)
                if (r < 0.60) return 'bell';
                if (r < 0.65) return 'replay';
                if (r < 0.68) return 'rare'; // レア役でストック抽選
                return 'blank';
            } else {
                if (r < 0.135) return 'replay';
                if (r < 0.060) return 'bell';
                if (r < 0.015) return 'rare';
                return 'blank';
            }
        }

        function checkBonusHit(role) {
            if (mode === 'bonus') return; // ボーナス中はストック抽選のみ
            
            let hitRate = 0;
            
            if (stock > 0 && mode !== 'normal') {
                // ストックあり時は32G以内に均等に放出 (約1/8)
                hitRate = 0.125; 
            } else if (mode === 'heaven') {
                // 天国中 (1/10で告知)
                hitRate = 0.1;
            } else if (mode === 'pullback') {
                // 引き戻し中 (通常より少し高い)
                hitRate = 1/150;
            } else {
                // 通常モード
                hitRate = 1/250;
                // レア役時は直撃確率UP
                if (role === 'rare') hitRate = 0.1; 
            }

            // 32G天井（ストックありor天国時）
            if ((stock > 0 || mode === 'heaven') && games === 32) {
                hitRate = 1.0;
            }

            if (Math.random() < hitRate) {
                triggerBonus();
            }
        }

        function triggerBonus() {
            playSound('kyuin');
            isFlashing = true;
            flashLamp();
            
            // BIG or REG 抽選 (6:4)
            bonusType = Math.random() < 0.6 ? 'BIG' : 'REG';
            
            log(`<span class="danger">【告知】${bonusType} BONUS 確定！</span>`);
        }

        function flashLamp() {
            if(!isFlashing) {
                lamps.forEach(l => l.classList.remove('flash'));
                return;
            }
            lamps.forEach(l => l.classList.toggle('flash'));
            setTimeout(flashLamp, 200);
        }

        function checkStock(role) {
            // ボーナス中・引き戻し中のレア役でストック抽選
            if (role === 'rare') {
                if (Math.random() < 0.25) { // レア役の25%でストック
                    stock++;
                    playSound('kyuin');
                    log('<span class="highlight">【ストック】1G連獲得！</span>');
                    updateDisplay();
                }
            }
        }

        // --- メインアクション ---
        function spin() {
            initAudio(); // ユーザーアクションでAudioContextを有効化
            
            if (mode !== 'bonus') {
                games++;
            }
            
            // ボーナス移行処理
            if (isFlashing && mode !== 'bonus') {
                isFlashing = false;
                mode = 'bonus';
                games = 0; // ボーナス当選でG数リセット
                if (stock > 0) stock--; // ストック消費
                
                atGamesLeft = bonusType === 'BIG' ? 60 : 20;
                
                // 天国移行抽選 (ボーナス開始時)
                if (mode !== 'heaven') {
                    if (Math.random() < 0.25) {
                        mode = 'heaven'; // 25%で天国へ
                    }
                }
            }

            // モード転落判定 (32G抜け)
            if (games > 32 && (mode === 'heaven' || mode === 'pullback')) {
                mode = 'normal';
                log('32Gスルー。通常モードへ移行。');
            }

            // コイン消費
            if (currentRole !== 'replay') {
                netTokens -= 3;
            }
            
            currentRole = determineRole();
            
            checkStock(currentRole);
            checkBonusHit(currentRole);

            if (mode === 'bonus') {
                atGamesLeft--;
            }

            updateDisplay();
            startReels();
            playSound('spin');

            btnSpin.disabled = true;
            document.getElementById('stop-0').disabled = false;
        }

        function updateDisplay() {
            domGames.innerText = games;
            domNet.innerText = netTokens;
            domNet.style.color = netTokens >= 0 ? '#00ff00' : '#ff3333';
            
            let statusText = mode === 'bonus' ? `${bonusType}中 (残${atGamesLeft}G)` : 
                             games <= 32 ? '引き戻し/天国?' : '通常';
            domStatus.innerText = statusText;
            domStock.innerText = stock;
        }

        // --- リール制御 ---
        function startReels() {
            reelsStopped = [false, false, false];
            for (let i=0; i<3; i++) {
                document.getElementById(`reel-${i}`).innerText = '-';
                reelsInt[i] = setInterval(() => {
                    document.getElementById(`reel-${i}`).innerText = symbols[Math.floor(Math.random() * symbols.length)];
                }, 50);
            }
        }

        function stopReel(idx) {
            if (reelsStopped[idx]) return;
            clearInterval(reelsInt[idx]);
            reelsStopped[idx] = true;
            playSound('stop');
            
            document.getElementById(`stop-${idx}`).disabled = true;

            // 擬似的な図柄停止表現
            let symbolToStop = '❌';
            if (isFlashing && reelsStopped.every(s=>s)) {
                symbolToStop = '7️⃣'; // 告知時は7やBARが揃う想定
            } else if (currentRole === 'replay') symbolToStop = '🔄';
            else if (currentRole === 'bell') symbolToStop = '🔔';
            else if (currentRole === 'rare') symbolToStop = '🍒'; // チェリーまたはスイカ
            
            document.getElementById(`reel-${idx}`).innerText = symbolToStop;

            // 次の停止ボタンを有効化
            if (idx < 2) {
                document.getElementById(`stop-${idx+1}`).disabled = false;
            } else {
                finishGame();
            }
        }

        function finishGame() {
            btnSpin.disabled = false;
            
            // 払い出し処理
            let pay = 0;
            if (currentRole === 'replay') { pay = 3; log('リプレイ'); }
            if (currentRole === 'bell') { pay = 8; log('ベル (+8枚)'); }
            if (currentRole === 'rare') { pay = 2; log('レア役 (+2枚)'); }
            
            if (pay > 0 && currentRole !== 'replay') {
                netTokens += pay;
                playSound('pay');
            }
            
            // ボーナス終了判定
            if (mode === 'bonus' && atGamesLeft <= 0) {
                mode = 'pullback';
                bonusType = null;
                log('ボーナス終了。32Gの引き戻し(天国)へ。');
            }
            
            updateDisplay();
        }
    </script>
</body>
</html>
