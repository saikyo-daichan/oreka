<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oki-Style Slot Simulator V8</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        #machine {
            background-color: #8b0000;
            border: 3px solid #ffd700;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        /* 上部ストック示唆ランプ */
        #top-lamp {
            width: 80%;
            height: 8px;
            background-color: #222;
            margin: 0 auto 15px auto;
            border-radius: 4px;
            transition: all 0.1s;
            border: 1px solid #111;
        }
        .flash-white { background-color: #fff; box-shadow: 0 0 3px #fff; }
        .flash-blue { background-color: #00aaff; box-shadow: 0 0 3px #00aaff; }
        .flash-green { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .flash-red { background-color: #ff0000; box-shadow: 0 0 12px #ff0000; }
        .flash-rainbow { 
            background: linear-gradient(90deg, red, orange, yellow, green, blue, purple); 
            box-shadow: 0 0 15px #fff; 
        }
        
        /* PT特化タイム中の黄色点滅アニメーション */
        @keyframes pulse-yellow {
            0% { background-color: #ccaa00; box-shadow: 0 0 5px #ccaa00; }
            50% { background-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            100% { background-color: #ccaa00; box-shadow: 0 0 5px #ccaa00; }
        }
        .pt-special-active {
            animation: pulse-yellow 0.8s infinite;
        }

        /* ビスカスランプ */
        #lamp-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        .lamp {
            width: 60px;
            height: 60px;
            background-color: #330000;
            border-radius: 50%;
            border: 2px solid #550000;
            transition: background-color 0.1s;
        }
        .lamp.flash {
            background-color: #ff3333;
            box-shadow: 0 0 25px #ff0000, 0 0 50px #ffaaaa;
            border-color: #ffaaaa;
        }
        
        /* ミニランプ */
        #mini-lamps {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            padding: 5px;
            background-color: #000;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .mini-lamp {
            width: 12px;
            height: 12px;
            background-color: #222;
            border-radius: 50%;
            border: 1px solid #000;
            box-shadow: inset 0 0 3px #000;
        }
        .mini-lamp.lit-red {
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333, inset 0 0 3px #fff;
            border-color: #ffaaaa;
        }
        .mini-lamp.lit-white {
            background-color: #ffffff;
            box-shadow: 0 0 6px #ffffff, inset 0 0 2px #ccc;
            border-color: #ffffff;
        }

        /* パネル情報 */
        .info-panel {
            background-color: #000;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            border: 2px solid #333;
        }
        .highlight { color: #00ff00; font-weight: bold; }
        .danger { color: #ff3333; font-weight: bold; }
        .pt-highlight { color: #ffcc00; font-weight: bold; }
        
        /* リール */
        #reels {
            display: flex;
            justify-content: space-between;
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .reel {
            width: 30%;
            height: 60px;
            background-color: #ddd;
            color: #000;
            font-size: 1.8rem;
            line-height: 60px;
            font-weight: bold;
            border: 2px solid #999;
            border-radius: 5px;
        }

        /* 操作系 */
        .controls-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 5px;
        }
        button {
            flex: 1;
            padding: 15px 5px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            touch-action: manipulation;
        }
        #spin-btn { background-color: #0066cc; color: #fff; }
        #spin-btn:disabled { background-color: #333; color: #666; }
        .skip-btn { background-color: #9900cc; color: #fff; }

        /* クレジット（差枚）ボックス */
        .credit-box {
            background-color: #000;
            border: 2px solid #444;
            border-radius: 5px;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 10px #000;
        }
        .credit-box span {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        .credit-box span.negative {
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }
        
        #console {
            background-color: #000;
            height: 140px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: #bbb;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="machine">
        <div id="top-lamp"></div>

        <div id="lamp-container">
            <div class="lamp" id="lamp-left"></div>
            <div class="lamp" id="lamp-right"></div>
        </div>

        <div id="mini-lamps">
            <div class="mini-lamp" id="ml-1"></div><div class="mini-lamp" id="ml-2"></div>
            <div class="mini-lamp" id="ml-3"></div><div class="mini-lamp" id="ml-4"></div>
            <div class="mini-lamp" id="ml-5"></div><div class="mini-lamp" id="ml-6"></div>
            <div class="mini-lamp" id="ml-7"></div><div class="mini-lamp" id="ml-8"></div>
            <div class="mini-lamp" id="ml-9"></div><div class="mini-lamp" id="ml-10"></div>
        </div>

        <div class="info-panel">
            <div>PT: <span id="pt-display" class="pt-highlight">0</span> (<span id="game-count">0</span>G)</div>
            <div>状態: <span id="status-display">通常</span></div>
        </div>

        <div id="reels">
            <div class="reel" id="reel-0">🍒</div>
            <div class="reel" id="reel-1">🔔</div>
            <div class="reel" id="reel-2">🍉</div>
        </div>

        <div class="controls-row">
            <button id="spin-btn" onclick="manualSpin()">手動 1G回す</button>
        </div>
        
        <div class="credit-box">
            <span>差枚数</span> <span id="net-tokens">0</span>
        </div>

        <div class="controls-row">
            <button class="skip-btn" onclick="executeSkip()">イベントスキップ</button>
        </div>

        <div id="console"></div>
    </div>

    <script>
        /* ========================================================
           サウンド設定
        ======================================================== */
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'spin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'stop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'kyuin') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(2000, now + 0.4);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'pay') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1500, now);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        /* ========================================================
           内部状態・パラメータ
        ======================================================== */
        let games = 0;
        let points = 0; // PTシステム導入
        let netTokens = 0;
        let chainTokens = 0;
        let mode = 'normal';
        let stockQueue = [];
        let pendingBonus = null;
        let currentBonus = null;
        let atGamesLeft = 0;
        
        let hiddenMode = 'A';
        let currentCeiling = 1200; // 初期1200PT
        
        // PT特化タイム関連
        let isPtSpecial = false;
        let ptSpecialGamesLeft = 0;

        let bonusGainedTokens = 0;
        let miniLampColors = [];
        let hasTriggered10Lamps = false;

        let isSkipping = false;
        let isRevealing = false; 

        let displayedNetTokens = 0;
        let tokenAnimInterval = null;

        const domGames = document.getElementById('game-count');
        const domPt = document.getElementById('pt-display');
        const domNet = document.getElementById('net-tokens');
        const domStatus = document.getElementById('status-display');
        const lamps = [document.getElementById('lamp-left'), document.getElementById('lamp-right')];
        const consoleEl = document.getElementById('console');
        const reels = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
        const topLamp = document.getElementById('top-lamp');

        function getBonusTag(type) {
            return type === 'BIG' ? '<span style="color:#ff5555; font-weight:bold;">BIG</span>' : '<span style="color:#55aaff; font-weight:bold;">REG</span>';
        }

        /* ========================================================
           モード移行ロジック (天井がPT依存に変更)
        ======================================================== */
        function setHiddenMode(isReset = false) {
            const r = Math.random();
            let nextMode = 'A';

            if (isReset) {
                if (r < 0.40) nextMode = 'A';
                else if (r < 0.70) nextMode = 'B';
                else nextMode = 'Heaven';
            } else {
                if (hiddenMode === 'A') {
                    if (r < 0.50) nextMode = 'A';
                    else if (r < 0.97) nextMode = 'B';
                    else nextMode = 'Heaven';
                } else if (hiddenMode === 'B') {
                    if (r < 0.05) nextMode = 'A';
                    else if (r < 0.45) nextMode = 'B';
                    else nextMode = 'Heaven';
                } else if (hiddenMode === 'Heaven') {
                    if (r < 0.70) nextMode = 'A';
                    else if (r < 0.90) nextMode = 'B';
                    else nextMode = 'Heaven';
                }
            }
            
            hiddenMode = nextMode;
            currentCeiling = (hiddenMode === 'B') ? 800 : (hiddenMode === 'Heaven' ? 200 : 1200);
        }

        function initMachine() {
            setHiddenMode(true);
            log("設定変更(リセット)完了。");
            checkStock(0.20, 0.20);
        }

        function log(msg) {
            consoleEl.innerHTML = `<div>${msg}</div>` + consoleEl.innerHTML;
        }

        function setLamp(state) {
            lamps.forEach(l => state ? l.classList.add('flash') : l.classList.remove('flash'));
        }

        function flashTopLamp() {
            // PT特化中なら光らせない(アニメーションを優先)
            if (isPtSpecial) return;

            let colorClass = 'flash-white';
            let r = Math.random();
            let s = stockQueue.length;

            if (s >= 3) {
                if (r < 0.005) colorClass = 'flash-rainbow';
                else if (r < 0.030) colorClass = 'flash-red';
                else if (r < 0.100) colorClass = 'flash-green';
                else if (r < 0.350) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            } else if (s >= 1) {
                if (r < 0.015) colorClass = 'flash-red';
                else if (r < 0.080) colorClass = 'flash-green';
                else if (r < 0.300) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            } else {
                if (r < 0.050) colorClass = 'flash-green';
                else if (r < 0.250) colorClass = 'flash-blue';
                else colorClass = 'flash-white';
            }

            topLamp.className = colorClass;
            setTimeout(() => { 
                if(!isPtSpecial) topLamp.className = ''; 
                else topLamp.className = 'pt-special-active';
            }, 500);
        }

        function updateTokenDisplay(targetTokens) {
            if (displayedNetTokens === targetTokens) return;
            if (tokenAnimInterval) clearInterval(tokenAnimInterval);
            
            let diff = Math.abs(targetTokens - displayedNetTokens);
            let step = targetTokens > displayedNetTokens ? 1 : -1;
            let intervalMs = 25; 

            if (diff > 20) intervalMs = 10;
            if (diff > 100) step *= Math.floor(diff / 50);

            tokenAnimInterval = setInterval(() => {
                displayedNetTokens += step;
                if ((step > 0 && displayedNetTokens >= targetTokens) || 
                    (step < 0 && displayedNetTokens <= targetTokens)) {
                    displayedNetTokens = targetTokens;
                    clearInterval(tokenAnimInterval);
                }
                
                domNet.innerText = displayedNetTokens;
                if (displayedNetTokens >= 0) {
                    domNet.classList.remove('negative');
                } else {
                    domNet.classList.add('negative');
                }
            }, intervalMs);
        }

        /* ========================================================
           抽選ロジック
        ======================================================== */
        function checkStock(bigProb, regProb) {
            let r = Math.random();
            if (r < bigProb) stockQueue.push('BIG');
            else if (r < (bigProb + regProb)) stockQueue.push('REG');
        }

        function trigger75Loop() {
            if (Math.random() < 0.5) stockQueue.push('BIG');
            else stockQueue.push('REG');
            while (true) {
                let loopR = Math.random();
                if (loopR < 0.30) stockQueue.push('BIG');
                else if (loopR < 0.75) stockQueue.push('REG');
                else break;
            }
        }
        
        function trigger25Loop() {
            // 25%を成功する限りループ(最低保証なし)
            while (Math.random() < 0.25) {
                if (Math.random() < 0.5) stockQueue.push('BIG');
                else stockQueue.push('REG');
            }
        }

        function determineRole() {
            const r = Math.random();
            if (mode === 'bonus') {
                if (r < 0.65) return { type: 'medium_bell', pay: 8, net: 5, name: '中ベル', symbol: '🔔' };
                if (r < 0.80) return { type: 'replay', pay: 3, net: 0, name: 'リプレイ', symbol: '🔄' };
                if (r < 0.82) return { type: 'suika', pay: 6, net: 3, name: 'スイカ', symbol: '🍉' };
                if (r < 0.83) return { type: 'cherry', pay: 2, net: -1, name: 'チェリー', symbol: '🍒' };
                return { type: 'blank', pay: 0, net: -3, name: 'ハズレ', symbol: '❌' };
            } else {
                if (stockQueue.length > 0 && Math.random() < (1/25.6)) {
                    return { type: 'fake_cherry', pay: 2, net: -1, name: 'チェリー', symbol: '🍒' }; 
                }
                if (r < 0.1515) return { type: 'replay', pay: 3, net: 0, name: 'リプレイ', symbol: '🔄' };
                if (r < 0.2814) return { type: 'small_bell', pay: 6, net: 3, name: '小ベル', symbol: '🔔' };
                if (r < 0.3281) return { type: 'medium_bell', pay: 11, net: 8, name: '中ベル', symbol: '🍉' };
                if (r < 0.3476) return { type: 'suika', pay: 9, net: 6, name: 'スイカ', symbol: '🍉' };
                if (r < 0.3574) return { type: 'cherry', pay: 5, net: 2, name: 'チェリー', symbol: '🍒' };
                return { type: 'blank', pay: 0, net: -3, name: 'ハズレ', symbol: '❌' };
            }
        }

        function playOneGame(isMuted = false) {
            initAudio();

            if (pendingBonus && mode !== 'bonus') {
                executeBonusReveal(isMuted);
                return;
            }

            const role = determineRole(); // 成立役を先に決定

            // PT特化タイムの管理
            if (mode !== 'bonus') {
                if (isPtSpecial) {
                    ptSpecialGamesLeft--;
                    if (ptSpecialGamesLeft <= 0) {
                        if (Math.random() < 0.20) {
                            ptSpecialGamesLeft = 3; // 20%ループ
                        } else {
                            isPtSpecial = false;
                        }
                    }
                } else {
                    // レア役でPT特化抽選 (次ゲームから適用)
                    if (role.type === 'suika' || role.type === 'cherry' || role.type === 'fake_cherry') {
                        if (Math.random() < 0.20) {
                            isPtSpecial = true;
                            ptSpecialGamesLeft = 3;
                        }
                    }
                }
            }

            if (mode !== 'bonus') {
                games++;
                
                // 33G目 通常転落処理
                if (mode === 'pullback' && games === 33) {
                    log(`32Gスルー 合計<span class="bonus-result">${chainTokens}枚獲得</span> 通常モードへ`);
                    mode = 'normal';
                    chainTokens = 0;
                    setHiddenMode(false);
                    checkStock(0.30, 0.20);
                    miniLampColors = [];
                    hasTriggered10Lamps = false;
                    updateUI(); 
                }

                // PT加算処理
                let oldPoints = points;
                let ptGain = 1; // デフォルト (ベル、ハズレ等)
                if (role.type === 'replay') ptGain = 3;
                else if (role.type === 'suika' || role.type === 'cherry' || role.type === 'fake_cherry') ptGain = 10;
                
                if (isPtSpecial) ptGain *= 2;
                points += ptGain;

                // 100PT毎のストック抽選 & 天国ゾーン確認
                let oldHundreds = Math.floor(oldPoints / 100);
                let newHundreds = Math.floor(points / 100);
                if (newHundreds > oldHundreds) {
                    let crosses = newHundreds - oldHundreds;
                    for (let i = 0; i < crosses; i++) {
                        let currentHundred = (oldHundreds + i + 1) * 100;
                        
                        // 100PT毎の汎用ストック抽選
                        checkStock(0.07, 0.08);

                        // 天国 100PT到達時の恩恵
                        if (hiddenMode === 'Heaven' && currentHundred === 100) {
                            checkStock(0.25, 0.25);
                        }
                    }
                }

                // 天井到達チェック
                if (points >= currentCeiling && oldPoints < currentCeiling) {
                    if (hiddenMode === 'Heaven') {
                        // 天国天井(200PT) 確定1つ + 25%ループ
                        if (Math.random() < 0.5) stockQueue.push('BIG'); else stockQueue.push('REG');
                        trigger25Loop();
                    } else {
                        // 通常/B天井
                        checkStock(0.40, 0.60);
                    }
                    pendingBonus = stockQueue.shift();
                }
            }

            checkStock(0.0001, 0.0004); // 毎G抽選

            netTokens += role.net;
            if (mode === 'bonus' || mode === 'pullback') chainTokens += role.net;
            if (mode === 'bonus') bonusGainedTokens += role.net;

            if (role.pay > 0 && currentRole !== 'replay' && !isMuted) playSound('pay');
            else if (!isMuted) playSound('spin');

            if (mode === 'bonus') {
                if (role.type === 'suika') checkStock(0.027, 0.003);
                else if (role.type === 'cherry') checkStock(0.015, 0.035);
                else if (role.type === 'blank') checkStock(0.0001, 0.0002);
            } else {
                // 通常・引き戻し中のレア役ストック
                if (role.type === 'suika' || role.type === 'cherry') {
                    checkStock(0.02, 0.03);
                }
            }

            // ボーナス直撃抽選 (確率は1/920ずつへ変更)
            if (mode !== 'bonus' && !pendingBonus && points < currentCeiling) {
                let isSelfDrawn = false; 

                if (role.type === 'suika') {
                    const rr = Math.random();
                    if (rr < 0.027) { pendingBonus = 'BIG'; isSelfDrawn = true; }
                    else if (rr < 0.030) { pendingBonus = 'REG'; isSelfDrawn = true; }
                } else if (role.type === 'cherry') {
                    const rr = Math.random();
                    if (rr < 0.015) { pendingBonus = 'BIG'; isSelfDrawn = true; }
                    else if (rr < 0.050) { pendingBonus = 'REG'; isSelfDrawn = true; }
                }
                
                if (!pendingBonus) {
                    const br = Math.random();
                    if (br < (1/920)) { pendingBonus = 'BIG'; isSelfDrawn = true; } // 1/920 BIG
                    else if (br < (2/920)) { pendingBonus = 'REG'; isSelfDrawn = true; } // 1/920 REG
                }

                if (isSelfDrawn && mode === 'pullback' && stockQueue.length === 0 && hasTriggered10Lamps) {
                    trigger75Loop();
                }

                // 引き戻し中ストック放出 (ゲーム数管理)
                if (mode === 'pullback' && !pendingBonus && stockQueue.length > 0) {
                    if (Math.random() < (1/16) || games === 32) {
                        pendingBonus = stockQueue.shift();
                    }
                }
            }

            // ボーナス終了
            if (mode === 'bonus') {
                atGamesLeft--;
                if (atGamesLeft <= 0) {
                    log(`<span class="bonus-result">${getBonusTag(currentBonus)}終了 ${bonusGainedTokens}枚獲得 引き戻しモードへ</span>`);
                    mode = 'pullback';
                    currentBonus = null;
                    setLamp(false);
                    if (!isMuted) flashTopLamp();
                }
            } 

            if (!isMuted) {
                reels.forEach(r => r.innerText = role.symbol);
                updateUI();
            }
            
            currentRole = role.type; 
        }
        let currentRole = '';

        function executeBonusReveal(isMuted) {
            let hitGame = games; 
            let hitPt = points; // 当選時のPTを記録
            
            games++;
            netTokens -= 3;
            chainTokens -= 3;
            let pB = pendingBonus;
            pendingBonus = null;

            if (mode === 'normal') chainTokens = -3;

            if (!isMuted) {
                isRevealing = true;
                document.getElementById('spin-btn').disabled = true;
                playSound('spin');
                
                updateUI();

                let r0 = setInterval(()=>reels[0].innerText = '🔄', 50);
                let r1 = setInterval(()=>reels[1].innerText = '🔄', 50);
                let r2 = setInterval(()=>reels[2].innerText = '🔄', 50);

                setTimeout(() => { clearInterval(r0); reels[0].innerText = '7️⃣'; playSound('stop'); }, 400);
                setTimeout(() => { clearInterval(r1); reels[1].innerText = '7️⃣'; playSound('stop'); }, 800);
                setTimeout(() => { 
                    clearInterval(r2); 
                    reels[2].innerText = pB === 'BIG' ? '7️⃣' : 'BAR'; 
                    playSound('stop');
                    
                    setTimeout(()=> {
                        isRevealing = false;
                        triggerBonusFinalize(pB, isMuted, hitGame, hitPt);
                        document.getElementById('spin-btn').disabled = false;
                    }, 600);
                }, 1200);
            } else {
                triggerBonusFinalize(pB, isMuted, hitGame, hitPt);
            }
        }

        function triggerBonusFinalize(type, isMuted, hitGame, hitPt) {
            mode = 'bonus';
            currentBonus = type;
            atGamesLeft = (type === 'BIG') ? 60 : 20;
            
            // ボーナス開始でG数とPTをリセット、特化タイムも強制終了
            games = 0; 
            points = 0;
            isPtSpecial = false;
            ptSpecialGamesLeft = 0;
            bonusGainedTokens = 0; 
            
            // ミニランプ点灯ロジック (BIG=赤2, REG=白1, 10個目はBIGのみ)
            if (type === 'BIG') {
                if (miniLampColors.length < 10) miniLampColors.push('red');
                if (miniLampColors.length < 10) miniLampColors.push('red');
            } else if (type === 'REG') {
                if (miniLampColors.length < 9) miniLampColors.push('white');
            }

            if (miniLampColors.length === 10 && !hasTriggered10Lamps) {
                hasTriggered10Lamps = true;
                trigger75Loop();
            }

            if (type === 'REG') checkStock(0.15, 0.05);

            if (!isMuted) {
                playSound('kyuin');
                log(`<span class="danger">キュイン！ ${getBonusTag(type)} BONUS 確定！ (${hitPt}PT / ${hitGame}G)</span>`);
                updateUI();
            } else {
                log(`<span class="danger">キュイン！ ${getBonusTag(type)} BONUS 確定！ (${hitPt}PT / ${hitGame}G)</span>`);
            }
        }

        /* ========================================================
           UI・操作系
        ======================================================== */
        function updateUI() {
            domGames.innerText = games;
            domPt.innerText = points; // PT表示
            
            updateTokenDisplay(netTokens);
            
            let statusText = '通常';
            if (mode === 'bonus') {
                let dispBonus = currentBonus === 'BIG' ? '<span style="color:#ff3333;">BIG</span>' : '<span style="color:#3399ff;">REG</span>';
                statusText = `${dispBonus} (${atGamesLeft}G)`;
            } else if (mode === 'pullback') {
                statusText = `引き戻し`;
            }
            domStatus.innerHTML = statusText;

            // ミニランプUI更新
            for (let i = 1; i <= 10; i++) {
                const ml = document.getElementById(`ml-${i}`);
                ml.className = 'mini-lamp'; 
                if (i <= miniLampColors.length) {
                    if (miniLampColors[i-1] === 'red') ml.classList.add('lit-red');
                    else ml.classList.add('lit-white');
                }
            }
            setLamp(pendingBonus !== null);

            // PT特化タイムのトップランプ制御
            if (isPtSpecial) {
                topLamp.className = 'pt-special-active';
            } else if (topLamp.className === 'pt-special-active') {
                topLamp.className = ''; // 通常時に戻す
            }
        }

        function manualSpin() {
            if (isSkipping || isRevealing) return;
            playOneGame(false);
        }

        function executeSkip() {
            if (isSkipping || isRevealing) return;
            isSkipping = true;
            
            let loopCount = 0;
            let startMode = mode;

            while (loopCount < 2500) {
                loopCount++;
                playOneGame(true); 

                if (startMode === 'normal') {
                    if (pendingBonus !== null || mode === 'bonus') break;
                } else if (startMode === 'bonus') {
                    if (mode !== 'bonus') break;
                } else if (startMode === 'pullback') {
                    if (pendingBonus !== null || mode === 'bonus' || mode === 'normal') break;
                }
            }

            isSkipping = false;
            updateUI();
        }

        initMachine();

    </script>
</body>
</html>
